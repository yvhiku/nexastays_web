name: Build web release image

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-web-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require build-time APIs
        run: |
          # Static SEO generation reads the Stays catalog only. Identity is a
          # runtime browser dependency and must not gate the image build.
          curl --fail --silent --show-error --retry 3 \
            --resolve api.nexastays.ma:443:72.60.133.228 \
            https://api.nexastays.ma/api/v1/health/ready >/dev/null
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          # Build-time SSG fetches use the origin because Cloudflare blocks
          # GitHub runner IPs. Browser/runtime URLs remain Cloudflare-backed.
          add-hosts: |
            api.nexastays.ma:72.60.133.228
            identity.nexastays.ma:72.60.133.228
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nexa-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
